[project]
name = "plc-trigger-suite"
version = "0.2.0"
description = "PLC trigger suite — photo capture and video recording on PLC bit rising edge, with MC Direct and gomc-rest support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymcprotocol>=0.3.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "gomc-rest-client>=0.8.0",
]

[project.optional-dependencies]
audio = [
    "beep-lite>=0.1.3",
]

[dependency-groups]
dev = [
    "opencv-stubs>=0.1.3",
    "ruff>=0.9.0",
    "ty>=0.0.1a2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "camera", "recorder", "plc_monitor", "settings_dialog"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"
